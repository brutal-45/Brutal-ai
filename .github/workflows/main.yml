name: Python Script Update

on:
 schedule:
   - cron: "*/9 * * * *"
 workflow_dispatch:

permissions: 
 contents: write

jobs:
  update-timestamp:
   runs-on: ubuntu-latest
   steps:
     - name: Checkout repository
       uses: actions/cheackout@v4

     - name: update timestamp file
       run: |
          TIMESTAMP_FILE="updates.txt"
          echo "Last checked: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" > "$TIMESTAMP_FILE"

     - name: Commite and push changes
       run: |
        git config user.name "brutal-45"
        git config user.email "creatorsports81@gmail.com"
        git add updates.txt
        if ! git diff --cahed --queit; then
          git commit -m "Update timestamp: $(date -u +"%y-m-%dT%H:%M:%SZ")"
          git push
        else
         echo "No changes to commit"
        fi
       


